plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Chargement des variables du fichier local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Définir les versions Flutter depuis local.properties
def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1') // Valeur par défaut = 1
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0') // Valeur par défaut = 1.0

android {
    namespace "com.example.trivial_pursuit"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.example.trivial_pursuit"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Configuration de signature
    signingConfigs {
        release {
            keyAlias localProperties.getProperty('KEY_ALIAS') ?: 'default_alias'
            keyPassword localProperties.getProperty('KEY_PASSWORD') ?: 'default_password'
            storeFile file(localProperties.getProperty('STORE_FILE_PATH') ?: './keystore.jks')
            storePassword localProperties.getProperty('STORE_PASSWORD') ?: 'default_store_password'
        }

        debug {
            keyAlias "debug"
            keyPassword "android"
            storeFile file("debug.keystore")
            storePassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
}
